# Manikour — Cloudflare Pages + D1 scores API
# Replace database_id after: wrangler d1 create manikour-scores

name = "manikour"
compatibility_date = "2026-11-27"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "manikour-scores"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "DB"

[observability]
enabled = true

[observability.traces]
enabled = true
